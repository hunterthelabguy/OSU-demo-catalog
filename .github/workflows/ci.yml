# The whole gate is `npm run verify`: typecheck, unit tests, production
# build, then the Playwright layout suite (mobile and desktop) against the built site.
# The README badge claims exactly this and nothing more.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: the attribution invariant in
      # tests/repo-invariants.test.ts walks every commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium only, matching playwright.config.ts. The layout suite
      # guards target sizes and overflow, not engine differences.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
